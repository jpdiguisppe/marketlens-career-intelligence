name: Provider Resilience

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  provider-resilience:
    name: Provider failure matrix
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run offline provider failure matrix
        id: resilience
        working-directory: backend
        shell: bash
        run: |
          set +e
          python scripts/run_provider_resilience_evaluation.py > /tmp/provider-resilience.txt 2>&1
          status=$?
          cat /tmp/provider-resilience.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Post safe failure summary
        if: github.event_name == 'pull_request' && steps.resilience.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'Provider resilience failure summary:'
            echo '```text'
            head -n 30 /tmp/provider-resilience.txt
            echo '```'
          } > /tmp/provider-resilience-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/provider-resilience-comment.md

      - name: Fail when provider resilience checks fail
        if: steps.resilience.outputs.status != '0'
        run: exit 1
