name: Personalized Coaching

on:
  pull_request:
    paths:
      - "backend/app/analysis/__init__.py"
      - "backend/app/analysis/schemas.py"
      - "backend/app/analysis/personalized_coaching.py"
      - "backend/app/analysis/personalized_coaching_reliability_patch.py"
      - "backend/app/analysis/personalized_coaching_title_patch.py"
      - "backend/app/analysis/coaching_evaluation.py"
      - "backend/evaluation/personalized_coaching_benchmark.json"
      - "backend/scripts/run_personalized_coaching_evaluation.py"
      - "backend/tests/test_personalized_coaching.py"
      - "backend/tests/test_personalized_coaching_evaluation.py"
      - "backend/tests/test_personalized_coaching_live_reliability.py"
      - "backend/tests/test_personalized_coaching_title_hydration.py"
      - "backend/requirements.txt"
      - "backend/requirements-dev.txt"
      - ".github/workflows/personalized-coaching.yml"
  workflow_dispatch:

jobs:
  personalized-coaching:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run focused personalized coaching tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_personalized_coaching.py \
            tests/test_personalized_coaching_evaluation.py \
            tests/test_personalized_coaching_live_reliability.py \
            tests/test_personalized_coaching_title_hydration.py \
            2>&1 | tee personalized-coaching-tests.txt
      - name: Run personalized coaching benchmark
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_personalized_coaching_evaluation.py \
            2>&1 | tee personalized-coaching-benchmark.txt
      - name: Run full backend compatibility suite
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee backend-compatibility-tests.txt
      - name: Upload personalized coaching reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personalized-coaching-report
          path: |
            backend/personalized-coaching-tests.txt
            backend/personalized-coaching-benchmark.txt
            backend/backend-compatibility-tests.txt
          if-no-files-found: error
