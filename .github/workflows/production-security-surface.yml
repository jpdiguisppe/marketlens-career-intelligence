name: Production Security Surface

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  production-security-surface:
    name: Exact-revision production security surface
    runs-on: ubuntu-24.04
    env:
      BACKEND_URL: https://marketlens-career-intelligence-production.up.railway.app
      FRONTEND_URL: https://marketlens-career-intelligence-production-8a34.up.railway.app

    steps:
      - name: Wait for exact Railway revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="${GITHUB_SHA,,}"
          output=/tmp/marketlens-production-security-surface
          mkdir -p "$output"
          printf 'expected_revision=%s\n' "$expected" > "$output/deployment-wait.txt"

          for attempt in $(seq 1 60); do
            backend_revision=$(curl --silent --show-error --max-time 20 \
              "$BACKEND_URL/deployment/status" \
              | python -c 'import json,sys; print(str(json.load(sys.stdin).get("revision", "")).lower())' \
              || true)

            railway_success_count=$(curl --silent --show-error --max-time 20 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$expected/status" \
              | python -c 'import json,sys; p=json.load(sys.stdin); urls={str(s.get("target_url", "")) for s in p.get("statuses", []) if s.get("state") == "success" and "railway.com/project/" in str(s.get("target_url", ""))}; print(len(urls))' \
              || true)

            printf 'attempt=%s backend_revision=%s railway_success_statuses=%s\n' \
              "$attempt" "$backend_revision" "$railway_success_count" \
              >> "$output/deployment-wait.txt"

            if [ "$backend_revision" = "$expected" ] && [ "${railway_success_count:-0}" -ge 2 ]; then
              echo "Backend reports exact revision and both Railway deployment statuses are successful for $expected"
              exit 0
            fi

            echo "Waiting for exact deployment (attempt $attempt/60): backend=$backend_revision railway_success_statuses=${railway_success_count:-0}"
            sleep 10
          done

          echo "Production did not converge to exact revision $expected in time."
          exit 1

      - name: Collect bounded production evidence
        shell: bash
        run: |
          set -euo pipefail
          output=/tmp/marketlens-production-security-surface
          mkdir -p "$output"

          probe_get() {
            name="$1"
            url="$2"
            code=$(curl --silent --show-error --max-time 30 \
              --dump-header "$output/$name.headers" \
              --output "$output/$name.body" \
              --write-out '%{http_code}' \
              "$url")
            printf '%s' "$code" > "$output/$name.status"
          }

          probe_get frontend-root "$FRONTEND_URL/"
          probe_get backend-health "$BACKEND_URL/health"
          probe_get backend-deployment-status "$BACKEND_URL/deployment/status"
          probe_get backend-docs "$BACKEND_URL/docs"
          probe_get backend-redoc "$BACKEND_URL/redoc"
          probe_get backend-openapi "$BACKEND_URL/openapi.json"
          probe_get private-me "$BACKEND_URL/me"
          probe_get private-saved-jobs "$BACKEND_URL/saved-jobs"
          probe_get private-saved-reports "$BACKEND_URL/saved-reports"
          probe_get private-career-plans "$BACKEND_URL/career-plans"

          hostile_code=$(curl --silent --show-error --max-time 30 \
            --request OPTIONS \
            --header 'Origin: https://attacker.invalid' \
            --header 'Access-Control-Request-Method: GET' \
            --dump-header "$output/cors-hostile.headers" \
            --output "$output/cors-hostile.body" \
            --write-out '%{http_code}' \
            "$BACKEND_URL/jobs/search")
          printf '%s' "$hostile_code" > "$output/cors-hostile.status"

          allowed_code=$(curl --silent --show-error --max-time 30 \
            --request OPTIONS \
            --header "Origin: $FRONTEND_URL" \
            --header 'Access-Control-Request-Method: GET' \
            --dump-header "$output/cors-allowed.headers" \
            --output "$output/cors-allowed.body" \
            --write-out '%{http_code}' \
            "$BACKEND_URL/jobs/search")
          printf '%s' "$allowed_code" > "$output/cors-allowed.status"

      - name: Enforce hardened production surface
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/marketlens-production-security-surface')

          def status(name: str) -> int:
              return int((root / f'{name}.status').read_text().strip())

          def headers(name: str) -> dict[str, str]:
              parsed: dict[str, str] = {}
              for raw_line in (root / f'{name}.headers').read_text(errors='replace').splitlines():
                  if ':' not in raw_line:
                      continue
                  key, value = raw_line.split(':', 1)
                  parsed[key.strip().lower()] = value.strip()
              return parsed

          frontend_headers = headers('frontend-root')
          backend_headers = headers('backend-health')
          hostile_headers = headers('cors-hostile')
          allowed_headers = headers('cors-allowed')
          failures: list[str] = []

          expected_public = {
              'frontend-root': 200,
              'backend-health': 200,
              'backend-deployment-status': 200,
          }
          for name, expected in expected_public.items():
              value = status(name)
              if value != expected:
                  failures.append(f'{name} returned HTTP {value}; expected {expected}')

          private_statuses = {
              name: status(name)
              for name in (
                  'private-me',
                  'private-saved-jobs',
                  'private-saved-reports',
                  'private-career-plans',
              )
          }
          for name, value in private_statuses.items():
              if value not in {401, 403}:
                  failures.append(f'{name} returned HTTP {value} without authentication')

          public_docs = {
              name: status(name)
              for name in ('backend-docs', 'backend-redoc', 'backend-openapi')
          }
          for name, value in public_docs.items():
              if value != 404:
                  failures.append(f'{name} remained publicly exposed with HTTP {value}')

          hostile_origin = hostile_headers.get('access-control-allow-origin')
          if hostile_origin in {'*', 'https://attacker.invalid'}:
              failures.append('hostile CORS origin was allowed')

          expected_origin = 'https://marketlens-career-intelligence-production-8a34.up.railway.app'
          allowed_origin = allowed_headers.get('access-control-allow-origin')
          if allowed_origin != expected_origin:
              failures.append(
                  f'production frontend CORS origin was not explicitly allowed; got {allowed_origin!r}'
              )

          required_headers = (
              'strict-transport-security',
              'content-security-policy',
              'x-content-type-options',
              'x-frame-options',
              'referrer-policy',
              'permissions-policy',
          )
          for name in required_headers:
              if not frontend_headers.get(name):
                  failures.append(f'frontend missing required security header: {name}')
              if not backend_headers.get(name):
                  failures.append(f'backend missing required security header: {name}')

          frontend_csp = frontend_headers.get('content-security-policy', '')
          if "frame-ancestors 'none'" not in frontend_csp:
              failures.append('frontend CSP is missing frame-ancestors isolation')
          if "object-src 'none'" not in frontend_csp:
              failures.append('frontend CSP is missing object-src isolation')
          if 'no-store' not in backend_headers.get('cache-control', '').lower():
              failures.append('backend API responses are missing no-store cache protection')

          report = {
              'public_route_statuses': {
                  name: status(name) for name in expected_public
              },
              'private_route_statuses': private_statuses,
              'public_docs': public_docs,
              'cors': {
                  'hostile_status': status('cors-hostile'),
                  'hostile_allow_origin': hostile_origin,
                  'allowed_status': status('cors-allowed'),
                  'allowed_allow_origin': allowed_origin,
              },
              'frontend_security_headers': {
                  name: frontend_headers.get(name) for name in required_headers
              },
              'backend_security_headers': {
                  name: backend_headers.get(name) for name in required_headers
              },
              'backend_cache_control': backend_headers.get('cache-control'),
              'failures': failures,
          }
          (root / 'marketlens-production-security-surface.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          if failures:
              raise SystemExit(1)
          PY

      - name: Upload production security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: marketlens-production-security-surface
          path: /tmp/marketlens-production-security-surface
          if-no-files-found: error
          retention-days: 90
