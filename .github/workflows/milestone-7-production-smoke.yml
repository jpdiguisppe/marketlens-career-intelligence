name: Milestone 7 Production Smoke Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run production smoke test
        run: python scripts/smoke_milestone7_production.py | tee milestone-7-production-smoke-report.json

      - name: Upload production smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-7-production-smoke-report
          path: milestone-7-production-smoke-report.json
