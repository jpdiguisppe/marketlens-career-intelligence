name: Temporary 8.2D Route Policy

on:
  push:
    branches:
      - agent/milestone-8-2d-surface-hardening

permissions:
  contents: write

jobs:
  tighten-route-policy:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone-8-2d-surface-hardening
      - name: Tighten expensive route limits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/main.py')
          text = path.read_text()
          text = text.replace(
              '_rate_limit_buckets: dict[str, list[float]] = {}\n_global_rate_limit_timestamps: list[float] = []\n\n\n',
              '',
          )
          for route in ('/analysis/custom', '/analysis/smart', '/analysis/smart/batch'):
              old = f'    "{route}",\n    response_model='
              index = text.index(old)
              dep_index = text.index('dependencies=[Depends(enforce_public_rate_limit)]', index)
              next_close = text.index(')\n', dep_index)
              if dep_index > next_close:
                  raise RuntimeError(f'Could not find rate policy for {route}')
              text = (
                  text[:dep_index]
                  + 'dependencies=[Depends(enforce_expensive_rate_limit)]'
                  + text[dep_index + len('dependencies=[Depends(enforce_public_rate_limit)]'):]
              )
          path.write_text(text)
          PY
          python -m compileall -q backend/app
          git diff --check
      - name: Commit route policy change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/main.py
          git commit -m "Milestone 8.2D — Tighten expensive operation limits"
          git push origin HEAD:agent/milestone-8-2d-surface-hardening
