name: Stabilization Evaluations

on:
  pull_request:
    branches: [main]

jobs:
  evaluations:
    if: github.head_ref == 'agent/stabilize-search-abbreviations-levels-smartrecruiters'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Job-search evaluation
        working-directory: backend
        run: python scripts/run_job_search_evaluation.py
      - name: Smart Fit evaluation
        working-directory: backend
        run: python scripts/run_smart_fit_evaluation.py
      - name: Semantic extraction evaluation
        working-directory: backend
        run: python scripts/run_semantic_extraction_evaluation.py
      - name: Evidence provenance evaluation
        working-directory: backend
        run: python scripts/run_evidence_provenance_evaluation.py
      - name: Personalized coaching evaluation
        working-directory: backend
        run: python scripts/run_personalized_coaching_evaluation.py
