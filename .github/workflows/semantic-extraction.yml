name: Semantic Extraction

on:
  pull_request:
    paths:
      - "backend/app/analysis/model_extractor.py"
      - "backend/app/analysis/semantic_contract.py"
      - "backend/app/analysis/semantic_merge_patch.py"
      - "backend/tests/test_model_assisted_semantic_contract.py"
      - "backend/tests/test_semantic_merge_safeguards.py"
      - "backend/tests/fixtures/model_assisted_extraction_v8b1.json"
      - ".github/workflows/semantic-extraction.yml"
  workflow_dispatch:

jobs:
  semantic-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run semantic extraction tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q \
            tests/test_model_assisted_semantic_contract.py \
            tests/test_semantic_merge_safeguards.py \
            2>&1 | tee semantic-extraction-tests.txt
      - name: Upload semantic extraction report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-extraction-test-report
          path: backend/semantic-extraction-tests.txt
          if-no-files-found: error
