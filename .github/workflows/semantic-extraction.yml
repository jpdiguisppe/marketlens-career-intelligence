name: Semantic Extraction

on:
  pull_request:
    paths:
      - "backend/app/analysis/model_extractor.py"
      - "backend/app/analysis/semantic_contract.py"
      - "backend/app/analysis/semantic_merge_patch.py"
      - "backend/app/analysis/semantic_evaluation.py"
      - "backend/app/analysis/semantic_benchmark_suite.py"
      - "backend/evaluation/semantic_extraction_benchmark.json"
      - "backend/evaluation/semantic_extraction_overlap_cases.json"
      - "backend/scripts/run_semantic_extraction_evaluation.py"
      - "backend/tests/test_model_assisted_semantic_contract.py"
      - "backend/tests/test_semantic_merge_safeguards.py"
      - "backend/tests/test_semantic_extraction_evaluation.py"
      - "backend/tests/fixtures/model_assisted_extraction_v8b1.json"
      - "backend/requirements.txt"
      - "backend/requirements-dev.txt"
      - ".github/workflows/semantic-extraction.yml"
  workflow_dispatch:

jobs:
  semantic-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run semantic extraction tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_model_assisted_semantic_contract.py \
            tests/test_semantic_merge_safeguards.py \
            tests/test_semantic_extraction_evaluation.py \
            2>&1 | tee semantic-extraction-tests.txt
      - name: Run semantic comparison benchmark
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_semantic_extraction_evaluation.py \
            2>&1 | tee semantic-extraction-benchmark.txt
      - name: Run full backend compatibility suite
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee backend-compatibility-tests.txt
      - name: Upload semantic extraction reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-extraction-test-report
          path: |
            backend/semantic-extraction-tests.txt
            backend/semantic-extraction-benchmark.txt
            backend/backend-compatibility-tests.txt
          if-no-files-found: error
