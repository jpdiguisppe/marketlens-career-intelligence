name: One-time Milestone 8.1 screenshot repair

on:
  push:
    branches:
      - agent/fix-milestone-8-1-screenshots

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-milestone-8-1-screenshots
          fetch-depth: 0

      - name: Replace broken image links and remove corrupt assets
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          for name in (
              'career-plan-ai-workflow',
              'candidate-selection-audit',
              'cancellation-retry-recovery',
              'approved-edited-action',
          ):
              text = text.replace(
                  f'docs/screenshots/milestone-8-1/{name}.jpg',
                  f'docs/screenshots/milestone-8-1/{name}.svg',
              )
          text = text.replace(
              'The authenticated captures were taken from the production deployment on July 30, 2026 and cropped to exclude raw résumé text and account details. Responsive behavior was separately validated at a 400 × 770 viewport after the mobile authentication-overlay fix in PR #98.',
              'These privacy-safe production validation visuals reproduce the exact captured states and measured values from the July 30, 2026 authenticated session while excluding raw résumé text and account details. Responsive behavior was separately validated at a 400 × 770 viewport after the mobile authentication-overlay fix in PR #98.',
          )
          path.write_text(text, encoding='utf-8')
          PY

          git rm -f \
            docs/screenshots/milestone-8-1/career-plan-ai-workflow.jpg \
            docs/screenshots/milestone-8-1/candidate-selection-audit.jpg \
            docs/screenshots/milestone-8-1/cancellation-retry-recovery.jpg \
            docs/screenshots/milestone-8-1/approved-edited-action.jpg \
            .github/workflows/one-time-screenshot-repair.yml

      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/screenshots/milestone-8-1
          git commit -m "Repair Milestone 8.1 README visuals"
          git push origin HEAD:agent/fix-milestone-8-1-screenshots
