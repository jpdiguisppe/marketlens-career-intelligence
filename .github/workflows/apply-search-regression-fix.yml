name: Apply search regression fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-39-search-correctness-hardening
          fetch-depth: 0
      - name: Apply hosted-suite regression fix
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/search-hardening-regression-fix.patch
          git apply .github/search-hardening-regression-fix.patch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Verify targeted regressions and benchmark
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r backend/requirements.txt
          cd backend
          python -m pytest -q \
            tests/test_early_career_recall.py::test_scoring_accepts_generic_program_only_with_requested_role_evidence \
            tests/test_job_search_intent_filters.py::test_data_analyst_requires_data_or_analytics_signal \
            tests/test_job_search_cross_sector_correctness.py \
            tests/test_job_search_evaluation.py
          python scripts/run_job_search_evaluation.py
      - name: Commit fix and remove temporary diagnostics
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/search-hardening-regression-fix.patch
          rm -f .github/workflows/apply-search-regression-fix.yml
          rm -f .github/workflows/search-hardening-ci-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend .github
          git commit -m "Preserve validated early-career and data-family recall"
          git push origin HEAD:issue-39-search-correctness-hardening
