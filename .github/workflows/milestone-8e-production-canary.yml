name: Milestone 8E Production Canary

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/milestone-8e-production-canary.yml"
      - "scripts/smoke_milestone8e_production.py"
      - "backend/app/saved_jobs.py"
      - "backend/tests/test_deployment_status.py"
      - "frontend/docker-entrypoint.sh"
      - "frontend/src/App.tsx"
      - "frontend/src/ProviderTelemetryPanel.tsx"
  push:
    branches: [main]
  schedule:
    - cron: "23 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  frontend-contract:
    name: Frontend status and fallback contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate frontend source contract
        run: python scripts/smoke_milestone8e_production.py --frontend-source-only

  production-canary:
    name: Railway production canary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MARKETLENS_EXPECTED_REVISION: ${{ github.event_name == 'push' && github.sha || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run production canary
        shell: bash
        run: |
          set -o pipefail
          python scripts/smoke_milestone8e_production.py 2>&1 \
            | tee milestone-8e-production-canary-report.json

      - name: Upload document-free canary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-8e-production-canary-report
          path: milestone-8e-production-canary-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish production canary commit status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'Milestone 8E Production Canary',
              description: passed
                ? 'Exact-revision Railway production canary passed.'
                : 'Exact-revision Railway production canary failed.',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
