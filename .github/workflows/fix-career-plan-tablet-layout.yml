name: Fix Career Plan tablet layout

on:
  push:
    branches:
      - agent/fix-career-plan-tablet-overlap

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-career-plan-tablet-overlap
      - name: Repair tablet layout and add regression contract
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('frontend/src/careerPlanWorkspace.css')
          css = css_path.read_text(encoding='utf-8')

          old_columns = ".career-plan-sidebar,\n.career-plan-main {\n  display: grid;\n  gap: 18px;\n}"
          new_columns = ".career-plan-sidebar,\n.career-plan-main {\n  display: grid;\n  min-width: 0;\n  gap: 18px;\n}"
          if old_columns not in css:
              raise SystemExit('column shrink contract anchor not found')
          css = css.replace(old_columns, new_columns, 1)

          old_form = ".career-plan-form-grid {\n  display: grid;\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n  gap: 12px;\n}"
          new_form = ".career-plan-form-grid {\n  display: grid;\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n  gap: 12px;\n}\n\n.career-plan-form-grid > *,\n.career-plan-field,\n.career-plan-card,\n.career-plan-section-heading > *,\n.career-plan-run-header > * {\n  min-width: 0;\n}"
          if old_form not in css:
              raise SystemExit('form grid anchor not found')
          css = css.replace(old_form, new_form, 1)

          old_tablet = "@media (max-width: 1120px) {\n  .career-plan-layout {\n    grid-template-columns: 320px minmax(0, 1fr);\n  }\n\n  .career-plan-metric-grid {\n    grid-template-columns: repeat(2, minmax(0, 1fr));\n  }\n}\n\n@media (max-width: 940px) {"
          new_tablet = "@media (max-width: 1120px) {\n  .career-plan-layout {\n    grid-template-columns: 320px minmax(0, 1fr);\n  }\n\n  .career-plan-form-grid {\n    grid-template-columns: 1fr;\n  }\n\n  .career-plan-metric-grid {\n    grid-template-columns: repeat(2, minmax(0, 1fr));\n  }\n}\n\n@media (max-width: 1040px) {"
          if old_tablet not in css:
              raise SystemExit('tablet breakpoint anchor not found')
          css = css.replace(old_tablet, new_tablet, 1)
          css_path.write_text(css, encoding='utf-8')

          test_path = Path('backend/tests/test_career_plan_tablet_layout_contract.py')
          test_path.write_text('''from pathlib import Path


REPOSITORY_ROOT = Path(__file__).resolve().parents[2]
CAREER_PLAN_STYLES = REPOSITORY_ROOT / "frontend" / "src" / "careerPlanWorkspace.css"


def test_career_plan_columns_can_shrink_without_overlap() -> None:
    source = CAREER_PLAN_STYLES.read_text(encoding="utf-8")

    columns = source.split(".career-plan-sidebar,", 1)[1].split("}", 1)[0]
    assert ".career-plan-main" in columns
    assert "min-width: 0;" in columns
    assert ".career-plan-form-grid > *" in source
    assert ".career-plan-card," in source


def test_career_plan_tablet_layout_reduces_density_before_stacking() -> None:
    source = CAREER_PLAN_STYLES.read_text(encoding="utf-8")

    tablet = source.split("@media (max-width: 1120px)", 1)[1].split(
        "@media (max-width: 1040px)", 1
    )[0]
    assert ".career-plan-form-grid" in tablet
    assert "grid-template-columns: 1fr;" in tablet

    stacked = source.split("@media (max-width: 1040px)", 1)[1].split(
        "@media (max-width: 700px)", 1
    )[0]
    assert ".career-plan-hero," in stacked
    assert ".career-plan-layout" in stacked
    assert "grid-template-columns: 1fr;" in stacked
    assert ".career-plan-sidebar" in stacked
    assert "position: static;" in stacked
''', encoding='utf-8')
          PY
          rm -f .github/workflows/fix-career-plan-tablet-layout.yml .tablet-layout-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/careerPlanWorkspace.css backend/tests/test_career_plan_tablet_layout_contract.py .github/workflows/fix-career-plan-tablet-layout.yml .tablet-layout-trigger
          git commit -m "Fix Career Plan tablet layout overlap"
          git push