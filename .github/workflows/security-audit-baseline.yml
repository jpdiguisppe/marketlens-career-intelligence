name: Security Audit Baseline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-and-python-security-audit:
    name: Dependency and Python security audit
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit==2.10.0 bandit==1.9.4

      - name: Audit Python dependencies
        id: pip_audit
        shell: bash
        run: |
          set +e
          python -m pip_audit \
            --requirement backend/requirements.txt \
            --format json \
            --output /tmp/marketlens-pip-audit.json
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Scan Python application source
        id: bandit
        shell: bash
        run: |
          set +e
          bandit \
            --recursive backend/app \
            --severity-level low \
            --confidence-level medium \
            --format json \
            --output /tmp/marketlens-bandit.json
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production npm dependencies
        id: npm_production_audit
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/marketlens-npm-production-audit.json
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Audit full npm dependency tree
        id: npm_full_audit
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/marketlens-npm-full-audit.json
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write audit status summary
        shell: bash
        run: |
          cat > /tmp/marketlens-security-audit-status.txt <<EOF
          pip_audit_status=${{ steps.pip_audit.outputs.status }}
          bandit_status=${{ steps.bandit.outputs.status }}
          npm_production_audit_status=${{ steps.npm_production_audit.outputs.status }}
          npm_full_audit_status=${{ steps.npm_full_audit.outputs.status }}
          EOF
          cat /tmp/marketlens-security-audit-status.txt

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: marketlens-security-audit-baseline
          path: |
            /tmp/marketlens-pip-audit.json
            /tmp/marketlens-bandit.json
            /tmp/marketlens-npm-production-audit.json
            /tmp/marketlens-npm-full-audit.json
            /tmp/marketlens-security-audit-status.txt
          if-no-files-found: error
          retention-days: 90

      - name: Flag discovered audit findings
        if: >-
          steps.pip_audit.outputs.status != '0' ||
          steps.bandit.outputs.status != '0' ||
          steps.npm_production_audit.outputs.status != '0' ||
          steps.npm_full_audit.outputs.status != '0'
        run: |
          echo "One or more baseline scanners reported findings. Review the uploaded JSON evidence before merging."
          exit 1
