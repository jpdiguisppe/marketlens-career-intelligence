name: Temporary 8.2D Prefix Cleanup

on:
  push:
    branches:
      - agent/milestone-8-2d-surface-hardening

permissions:
  contents: write

jobs:
  clean-prefixes:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone-8-2d-surface-hardening
      - name: Remove generator line-continuation prefixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          candidates = (
              'backend/app/security.py',
              'backend/app/resume_files.py',
              'backend/Dockerfile',
              'frontend/Dockerfile',
              'backend/tests/test_surface_security_hardening.py',
              'backend/tests/test_resume_file_security.py',
              'docs/milestone-8-2d-surface-hardening.md',
          )
          changed = []
          for filename in candidates:
              path = Path(filename)
              text = path.read_text()
              if text.startswith('\\\n'):
                  path.write_text(text[2:])
                  changed.append(filename)
          if not changed:
              raise SystemExit('No generator prefixes found to clean.')
          print('Cleaned:', *changed, sep='\n- ')
          PY
          python -m compileall -q backend/app backend/tests
          git diff --check
      - name: Commit cleaned files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend frontend/Dockerfile docs
          git commit -m "Milestone 8.2D — Clean generated file prefixes"
          git push origin HEAD:agent/milestone-8-2d-surface-hardening
