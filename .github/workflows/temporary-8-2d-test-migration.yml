name: Temporary 8.2D Test Migration

on:
  push:
    branches:
      - agent/milestone-8-2d-surface-hardening

permissions:
  contents: write

jobs:
  migrate-tests:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone-8-2d-surface-hardening
      - name: Update legacy rate-limit test reset calls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for filename in ('backend/tests/test_api.py', 'backend/tests/test_job_search_api.py'):
              path = Path(filename)
              text = path.read_text()
              old_import = 'from app.main import _rate_limit_buckets, app\n'
              if old_import not in text:
                  raise RuntimeError(f'Legacy import not found in {filename}')
              text = text.replace(
                  old_import,
                  'from app.main import app\nfrom app.security import reset_rate_limit_state_for_tests\n',
              )
              text = text.replace('_rate_limit_buckets.clear()', 'reset_rate_limit_state_for_tests()')
              path.write_text(text)
          PY
          python -m compileall -q backend/tests
          git diff --check
      - name: Commit migrated tests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/test_api.py backend/tests/test_job_search_api.py
          git commit -m "Milestone 8.2D — Migrate rate-limit test reset API"
          git push origin HEAD:agent/milestone-8-2d-surface-hardening
