name: 8E.3 Formal Evaluations

on:
  pull_request:
    branches: [main]

jobs:
  evaluations:
    if: github.head_ref == 'agent/milestone-8e-provider-telemetry'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Job-search evaluation
        working-directory: backend
        run: python scripts/run_job_search_evaluation.py
      - name: Semantic extraction evaluation
        working-directory: backend
        run: python scripts/run_semantic_extraction_evaluation.py
      - name: Smart Fit evaluation
        working-directory: backend
        run: python scripts/run_smart_fit_evaluation.py
      - name: Evidence provenance evaluation
        working-directory: backend
        run: python scripts/run_evidence_provenance_evaluation.py
      - name: Personalized coaching evaluation
        working-directory: backend
        run: python scripts/run_personalized_coaching_evaluation.py
      - name: Operational reliability evaluation
        working-directory: backend
        env:
          AI_ANALYSIS_ENABLED: 'false'
        run: python scripts/run_operational_reliability_evaluation.py
      - name: Provider resilience evaluation
        working-directory: backend
        run: python scripts/run_provider_resilience_evaluation.py
      - name: Provider telemetry tests
        working-directory: backend
        run: python -m pytest -q tests/test_provider_telemetry.py tests/test_provider_telemetry_summary_policy.py
