name: Frontend Lockfile Refresh

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/frontend-lockfile-refresh.yml"

permissions:
  contents: write

jobs:
  generate-and-validate:
    name: Generate and validate frontend lockfile
    runs-on: ubuntu-24.04

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate candidate lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact candidate dependency tree
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit complete dependency tree
        working-directory: frontend
        run: npm audit --audit-level=moderate

      - name: Commit generated lockfile to pull request branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current."
            exit 0
          fi
          git commit -m "security: refresh frontend dependency lockfile"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: marketlens-frontend-lockfile-candidate
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 7
