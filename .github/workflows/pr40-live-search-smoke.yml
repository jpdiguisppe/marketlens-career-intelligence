name: PR 40 Live Search Smoke

on:
  pull_request:
    branches: [main]

jobs:
  live-cross-sector-search:
    if: github.head_ref == 'issue-39-search-correctness-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run live cross-sector search smoke
        id: live_smoke
        continue-on-error: true
        working-directory: backend
        run: |
          set -o pipefail
          python scripts/run_live_search_hardening_smoke.py | tee live-search-smoke.json

      - name: Upload live smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr40-live-search-smoke
          path: backend/live-search-smoke.json
          if-no-files-found: error

      - name: Fail when live smoke fails
        if: steps.live_smoke.outcome == 'failure'
        run: exit 1
