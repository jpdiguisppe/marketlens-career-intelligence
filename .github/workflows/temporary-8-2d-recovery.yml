name: Temporary 8.2D Recovery

on:
  push:
    branches:
      - agent/milestone-8-2d-surface-hardening

permissions:
  contents: write

jobs:
  recover-generated-candidate:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          ref: agent/milestone-8-2d-surface-hardening
          fetch-depth: 0

      - name: Execute existing hardening generator
        shell: bash
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          workflow = yaml.safe_load(
              Path('.github/workflows/temporary-8-2d-surface-hardening.yml').read_text()
          )
          steps = workflow['jobs']['apply-hardening']['steps']
          generator = next(
              step['run']
              for step in steps
              if step.get('name') == 'Apply bounded security hardening'
          )
          subprocess.run(generator, shell=True, executable='/bin/bash', check=True)
          PY

      - name: Restore workflow files and validate candidate
        shell: bash
        run: |
          git restore --source=HEAD -- .github/workflows
          python -m compileall -q backend/app backend/tests
          grep -q 'USER marketlens' backend/Dockerfile
          grep -q 'USER nginx' frontend/Dockerfile
          grep -q 'Content-Security-Policy' frontend/nginx.conf
          test -f backend/app/security.py
          test -f backend/tests/test_resume_file_security.py
          test -f backend/tests/test_surface_security_hardening.py
          git diff --check

      - name: Commit only non-workflow hardening changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend frontend docs
          git diff --cached --quiet && { echo 'No non-workflow changes generated.'; exit 1; }
          git commit -m "Milestone 8.2D — Harden API, uploads, browser, and containers"
          git push origin HEAD:agent/milestone-8-2d-surface-hardening
