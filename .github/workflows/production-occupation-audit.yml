name: Production Occupation Audit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/production-occupation-audit.yml
      - backend/app/job_search*.py
      - backend/app/occupation*.py
      - backend/evaluation/production_occupation_audit.json
      - backend/scripts/run_production_occupation_audit.py
      - backend/tests/test_job_search*.py
      - backend/tests/test_production_occupation_audit*.py
      - backend/tests/test_production_search_hotfix.py
      - docs/milestone-8-1i-held-out-occupation-evaluation.md
      - docs/milestone-8-universal-search-signoff.md
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  production-occupation-audit:
    name: Exact-revision 40-search production audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_REVISION: ${{ github.sha }}
      AUDIT_WAIT_SECONDS: "900"
      AUDIT_INTER_REQUEST_SECONDS: "2.25"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run bounded production occupation audit
        id: audit
        working-directory: backend
        shell: bash
        run: |
          set +e
          python scripts/run_production_occupation_audit.py > /tmp/marketlens-production-occupation-audit.txt 2>&1
          status=$?
          cat /tmp/marketlens-production-occupation-audit.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload production occupation audit evidence
        uses: actions/upload-artifact@v7
        with:
          name: marketlens-production-occupation-audit
          path: /tmp/marketlens-production-occupation-audit.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish production occupation audit status
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.audit.outputs.status }}' === '0';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'Production Occupation Audit',
              description: passed
                ? 'Exact-revision 40-search occupation audit passed.'
                : 'Exact-revision 40-search occupation audit failed.',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Fail when production occupation audit fails
        if: steps.audit.outputs.status != '0'
        run: exit 1
