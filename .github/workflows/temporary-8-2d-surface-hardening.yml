name: Temporary 8.2D Surface Hardening

on:
  push:
    branches:
      - agent/milestone-8-2d-surface-hardening

permissions:
  contents: write

jobs:
  apply-hardening:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          ref: agent/milestone-8-2d-surface-hardening
          fetch-depth: 0

      - name: Apply bounded security hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          security_py = dedent(r'''\
          from __future__ import annotations

          import ipaddress
          import os
          import threading
          import time
          from dataclasses import dataclass

          from fastapi import HTTPException, Request
          from starlette.middleware.base import BaseHTTPMiddleware, RequestResponseEndpoint
          from starlette.responses import JSONResponse, Response
          from starlette.types import ASGIApp, Message, Receive, Scope, Send

          TRUSTED_PROXY_CIDRS_ENV = "TRUSTED_PROXY_CIDRS"
          MARKETLENS_ENVIRONMENT_ENV = "MARKETLENS_ENVIRONMENT"
          _PRODUCTION_ENVIRONMENT_NAMES = {"prod", "production"}
          _RAILWAY_RUNTIME_ENVIRONMENT_VARIABLES = (
              "RAILWAY_PROJECT_ID",
              "RAILWAY_SERVICE_ID",
              "RAILWAY_ENVIRONMENT_ID",
              "RAILWAY_ENVIRONMENT_NAME",
          )

          RATE_LIMIT_WINDOW_SECONDS = 60
          RATE_LIMIT_GLOBAL_MAX_REQUESTS = 300
          RATE_LIMIT_MAX_TRACKED_CLIENTS = 5_000
          RATE_LIMIT_PUBLIC_MAX_REQUESTS = 30
          RATE_LIMIT_EXPENSIVE_MAX_REQUESTS = 12
          RATE_LIMIT_ADMIN_MAX_REQUESTS = 10
          RATE_LIMIT_PRIVATE_MAX_REQUESTS = 90
          MAX_API_REQUEST_BODY_BYTES = 2_000_000


          @dataclass(frozen=True)
          class RateLimitPolicy:
              scope: str
              max_requests: int


          PUBLIC_RATE_LIMIT = RateLimitPolicy("public", RATE_LIMIT_PUBLIC_MAX_REQUESTS)
          EXPENSIVE_RATE_LIMIT = RateLimitPolicy("expensive", RATE_LIMIT_EXPENSIVE_MAX_REQUESTS)
          ADMIN_RATE_LIMIT = RateLimitPolicy("admin", RATE_LIMIT_ADMIN_MAX_REQUESTS)
          PRIVATE_RATE_LIMIT = RateLimitPolicy("private", RATE_LIMIT_PRIVATE_MAX_REQUESTS)

          _rate_limit_buckets: dict[str, list[float]] = {}
          _global_rate_limit_timestamps: list[float] = []
          _rate_limit_lock = threading.Lock()


          def is_production_or_railway_runtime() -> bool:
              explicit_environment = (os.getenv(MARKETLENS_ENVIRONMENT_ENV) or "").strip().lower()
              if explicit_environment in _PRODUCTION_ENVIRONMENT_NAMES:
                  return True
              return any(
                  bool((os.getenv(variable_name) or "").strip())
                  for variable_name in _RAILWAY_RUNTIME_ENVIRONMENT_VARIABLES
              )


          def fastapi_docs_configuration() -> dict[str, str | None]:
              """Disable interactive API discovery on deployed production runtimes."""
              if is_production_or_railway_runtime():
                  return {"docs_url": None, "redoc_url": None, "openapi_url": None}
              return {"docs_url": "/docs", "redoc_url": "/redoc", "openapi_url": "/openapi.json"}


          def _validated_ip(value: str | None) -> str | None:
              if not value:
                  return None
              try:
                  return str(ipaddress.ip_address(value.strip()))
              except ValueError:
                  return None


          def _trusted_proxy_networks() -> tuple[ipaddress.IPv4Network | ipaddress.IPv6Network, ...]:
              networks: list[ipaddress.IPv4Network | ipaddress.IPv6Network] = []
              configured = os.getenv(TRUSTED_PROXY_CIDRS_ENV, "")
              for raw_network in configured.split(","):
                  candidate = raw_network.strip()
                  if not candidate:
                      continue
                  try:
                      networks.append(ipaddress.ip_network(candidate, strict=False))
                  except ValueError:
                      # Invalid entries fail closed: they never make a peer trusted.
                      continue
              return tuple(networks)


          def _peer_is_trusted_proxy(peer_ip: str | None) -> bool:
              validated_peer = _validated_ip(peer_ip)
              if not validated_peer:
                  return False
              address = ipaddress.ip_address(validated_peer)
              return any(address in network for network in _trusted_proxy_networks())


          def _get_rate_limit_identifier(request: Request) -> str:
              peer_host = request.client.host if request.client and request.client.host else None
              validated_peer = _validated_ip(peer_host)

              if _peer_is_trusted_proxy(validated_peer):
                  forwarded_for = request.headers.get("x-forwarded-for")
                  if forwarded_for:
                      forwarded_ip = _validated_ip(forwarded_for.split(",", maxsplit=1)[0])
                      if forwarded_ip:
                          return forwarded_ip

              if validated_peer:
                  return validated_peer
              if peer_host:
                  return peer_host[:120]
              return "unknown-client"


          def _prune_rate_limit_state(window_start: float) -> None:
              global _global_rate_limit_timestamps
              _global_rate_limit_timestamps = [
                  timestamp for timestamp in _global_rate_limit_timestamps if timestamp >= window_start
              ]

              stale_keys = [
                  key
                  for key, timestamps in _rate_limit_buckets.items()
                  if not timestamps or timestamps[-1] < window_start
              ]
              for key in stale_keys:
                  _rate_limit_buckets.pop(key, None)

              if len(_rate_limit_buckets) > RATE_LIMIT_MAX_TRACKED_CLIENTS:
                  oldest = sorted(
                      _rate_limit_buckets,
                      key=lambda key: _rate_limit_buckets[key][-1] if _rate_limit_buckets[key] else 0.0,
                  )
                  for key in oldest[: len(_rate_limit_buckets) - RATE_LIMIT_MAX_TRACKED_CLIENTS]:
                      _rate_limit_buckets.pop(key, None)


          def _enforce_rate_limit(
              request: Request,
              policy: RateLimitPolicy,
              *,
              explicit_identifier: str | None = None,
          ) -> None:
              # Starlette's in-process TestClient uses this synthetic peer name.
              # Real ASGI socket peers are IP addresses, so production traffic cannot trigger this bypass.
              if request.client and request.client.host == "testclient":
                  return

              identifier = explicit_identifier or _get_rate_limit_identifier(request)
              bucket_key = f"{policy.scope}:{identifier}"
              now = time.monotonic()
              window_start = now - RATE_LIMIT_WINDOW_SECONDS

              with _rate_limit_lock:
                  _prune_rate_limit_state(window_start)
                  if len(_global_rate_limit_timestamps) >= RATE_LIMIT_GLOBAL_MAX_REQUESTS:
                      raise HTTPException(
                          status_code=429,
                          detail="Service-wide rate limit exceeded. Please wait before trying again.",
                          headers={"Retry-After": str(RATE_LIMIT_WINDOW_SECONDS)},
                      )

                  request_timestamps = _rate_limit_buckets.setdefault(bucket_key, [])
                  request_timestamps[:] = [
                      timestamp for timestamp in request_timestamps if timestamp >= window_start
                  ]
                  if len(request_timestamps) >= policy.max_requests:
                      raise HTTPException(
                          status_code=429,
                          detail="Rate limit exceeded. Please wait before trying again.",
                          headers={"Retry-After": str(RATE_LIMIT_WINDOW_SECONDS)},
                      )

                  request_timestamps.append(now)
                  _global_rate_limit_timestamps.append(now)


          def enforce_public_rate_limit(request: Request) -> None:
              _enforce_rate_limit(request, PUBLIC_RATE_LIMIT)


          def enforce_expensive_rate_limit(request: Request) -> None:
              _enforce_rate_limit(request, EXPENSIVE_RATE_LIMIT)


          def enforce_admin_rate_limit(request: Request) -> None:
              _enforce_rate_limit(request, ADMIN_RATE_LIMIT)


          def enforce_private_rate_limit(request: Request, user_id: str) -> None:
              normalized_user_id = user_id.strip()[:255] if isinstance(user_id, str) else ""
              if not normalized_user_id:
                  raise HTTPException(status_code=401, detail="Authenticated user ID is missing.")
              _enforce_rate_limit(
                  request,
                  PRIVATE_RATE_LIMIT,
                  explicit_identifier=f"user:{normalized_user_id}",
              )


          def reset_rate_limit_state_for_tests() -> None:
              with _rate_limit_lock:
                  _rate_limit_buckets.clear()
                  _global_rate_limit_timestamps.clear()


          class RequestBodyLimitMiddleware:
              """Reject oversized request bodies before JSON or multipart parsing."""

              def __init__(self, app: ASGIApp, max_body_bytes: int = MAX_API_REQUEST_BODY_BYTES) -> None:
                  self.app = app
                  self.max_body_bytes = max_body_bytes

              async def __call__(self, scope: Scope, receive: Receive, send: Send) -> None:
                  if scope.get("type") != "http" or scope.get("method") not in {"POST", "PUT", "PATCH"}:
                      await self.app(scope, receive, send)
                      return

                  headers = {
                      key.lower(): value
                      for key, value in scope.get("headers", [])
                  }
                  raw_content_length = headers.get(b"content-length")
                  if raw_content_length:
                      try:
                          if int(raw_content_length) > self.max_body_bytes:
                              response = JSONResponse(
                                  status_code=413,
                                  content={"detail": "Request body is too large."},
                              )
                              await response(scope, receive, send)
                              return
                      except ValueError:
                          response = JSONResponse(
                              status_code=400,
                              content={"detail": "Invalid Content-Length header."},
                          )
                          await response(scope, receive, send)
                          return

                  buffered_messages: list[Message] = []
                  received_bytes = 0
                  while True:
                      message = await receive()
                      buffered_messages.append(message)
                      if message["type"] == "http.disconnect":
                          break
                      if message["type"] != "http.request":
                          continue

                      received_bytes += len(message.get("body", b""))
                      if received_bytes > self.max_body_bytes:
                          response = JSONResponse(
                              status_code=413,
                              content={"detail": "Request body is too large."},
                          )
                          await response(scope, receive, send)
                          return
                      if not message.get("more_body", False):
                          break

                  index = 0

                  async def replay_receive() -> Message:
                      nonlocal index
                      if index < len(buffered_messages):
                          message = buffered_messages[index]
                          index += 1
                          return message
                      return {"type": "http.request", "body": b"", "more_body": False}

                  await self.app(scope, replay_receive, send)


          class SecurityHeadersMiddleware(BaseHTTPMiddleware):
              """Apply defense-in-depth API headers and prevent sensitive response caching."""

              async def dispatch(
                  self,
                  request: Request,
                  call_next: RequestResponseEndpoint,
              ) -> Response:
                  response = await call_next(request)
                  response.headers["Strict-Transport-Security"] = "max-age=31536000; includeSubDomains"
                  response.headers["X-Content-Type-Options"] = "nosniff"
                  response.headers["X-Frame-Options"] = "DENY"
                  response.headers["Referrer-Policy"] = "no-referrer"
                  response.headers["Permissions-Policy"] = (
                      "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
                  )
                  response.headers["Cache-Control"] = "no-store, max-age=0"
                  response.headers["Pragma"] = "no-cache"
                  if is_production_or_railway_runtime():
                      response.headers["Content-Security-Policy"] = (
                          "default-src 'none'; frame-ancestors 'none'; base-uri 'none'"
                      )
                  return response
          ''')
          Path("backend/app/security.py").write_text(security_py)

          resume_files_py = dedent(r'''\
          """Resume file text extraction helpers with bounded parser resource use."""

          from __future__ import annotations

          import os
          from io import BytesIO
          from pathlib import PurePosixPath
          from zipfile import BadZipFile, ZipFile

          from docx import Document
          from pypdf import PdfReader, filters as pypdf_filters
          from pypdf.errors import PdfReadError

          SUPPORTED_RESUME_UPLOAD_EXTENSIONS = {".txt", ".md", ".pdf", ".docx"}

          MAX_DOCX_ARCHIVE_ENTRIES = 512
          MAX_DOCX_EXPANDED_BYTES = 8_000_000
          MAX_DOCX_ENTRY_BYTES = 4_000_000
          MAX_DOCX_COMPRESSION_RATIO = 100
          MAX_DOCX_PARAGRAPHS = 5_000
          MAX_DOCX_TABLE_CELLS = 10_000
          MAX_PDF_PAGES = 20
          MAX_PDF_PAGE_CONTENT_STREAM_BYTES = 8_000_000
          MAX_PARSER_EXTRACTED_TEXT_CHARACTERS = 50_000

          # pypdf documents its decompression controls as security knobs. MarketLens
          # processes small resumes, so lower the library-wide PDF decode ceilings
          # from the much larger defaults before any uploaded page is decoded.
          for _filter_limit_name in (
              "ZLIB_MAX_OUTPUT_LENGTH",
              "LZW_MAX_OUTPUT_LENGTH",
              "RUN_LENGTH_MAX_OUTPUT_LENGTH",
              "JBIG2_MAX_OUTPUT_LENGTH",
              "MAX_DECLARED_STREAM_LENGTH",
              "MAX_ARRAY_BASED_STREAM_OUTPUT_LENGTH",
              "FLATE_MAX_BUFFER_SIZE",
          ):
              if hasattr(pypdf_filters, _filter_limit_name):
                  setattr(pypdf_filters, _filter_limit_name, MAX_PDF_PAGE_CONTENT_STREAM_BYTES)
          if hasattr(pypdf_filters, "JBIG2DEC_BINARY"):
              pypdf_filters.JBIG2DEC_BINARY = None


          class ResumeFileExtractionError(ValueError):
              """Raised when uploaded resume text cannot be extracted safely."""


          def _normalize_extracted_text(text: str) -> str:
              return "\n".join(line.rstrip() for line in text.splitlines()).strip()


          def _extract_text_file(contents: bytes) -> str:
              try:
                  return contents.decode("utf-8-sig")
              except UnicodeDecodeError as exc:
                  raise ResumeFileExtractionError("Resume text file must be UTF-8 encoded.") from exc


          def _validate_docx_archive(contents: bytes) -> None:
              try:
                  with ZipFile(BytesIO(contents)) as archive:
                      entries = [entry for entry in archive.infolist() if not entry.is_dir()]
                      if len(entries) > MAX_DOCX_ARCHIVE_ENTRIES:
                          raise ResumeFileExtractionError(
                              "DOCX resume contains too many internal files to process safely."
                          )

                      names = {entry.filename for entry in entries}
                      if "[Content_Types].xml" not in names or "word/document.xml" not in names:
                          raise ResumeFileExtractionError("DOCX resume structure is invalid.")

                      expanded_bytes = 0
                      for entry in entries:
                          path = PurePosixPath(entry.filename)
                          if entry.filename.startswith("/") or ".." in path.parts:
                              raise ResumeFileExtractionError("DOCX resume contains an unsafe archive path.")
                          if entry.flag_bits & 0x1:
                              raise ResumeFileExtractionError("Encrypted DOCX resumes are not supported.")
                          if entry.file_size > MAX_DOCX_ENTRY_BYTES:
                              raise ResumeFileExtractionError(
                                  "DOCX resume contains an oversized internal file."
                              )

                          expanded_bytes += entry.file_size
                          if expanded_bytes > MAX_DOCX_EXPANDED_BYTES:
                              raise ResumeFileExtractionError(
                                  "DOCX resume expands beyond the safe processing limit."
                              )

                          if entry.file_size >= 64 * 1024:
                              ratio = entry.file_size / max(entry.compress_size, 1)
                              if ratio > MAX_DOCX_COMPRESSION_RATIO:
                                  raise ResumeFileExtractionError(
                                      "DOCX resume has a suspicious compression ratio."
                                  )

                      for entry in entries:
                          if not entry.filename.lower().endswith((".xml", ".rels")):
                              continue
                          xml_bytes = archive.read(entry)
                          upper_xml = xml_bytes.upper()
                          if b"<!DOCTYPE" in upper_xml or b"<!ENTITY" in upper_xml:
                              raise ResumeFileExtractionError(
                                  "DOCX resume contains unsupported XML entity declarations."
                              )
              except ResumeFileExtractionError:
                  raise
              except (BadZipFile, OSError, ValueError) as exc:
                  raise ResumeFileExtractionError("Could not read this DOCX resume file.") from exc


          def _extract_docx_text(contents: bytes) -> str:
              if not contents.startswith(b"PK"):
                  raise ResumeFileExtractionError("DOCX resume structure is invalid.")
              _validate_docx_archive(contents)

              try:
                  document = Document(BytesIO(contents))
              except Exception as exc:  # python-docx exposes several zip/XML parser exceptions.
                  raise ResumeFileExtractionError("Could not read text from this DOCX resume file.") from exc

              if len(document.paragraphs) > MAX_DOCX_PARAGRAPHS:
                  raise ResumeFileExtractionError("DOCX resume contains too many paragraphs to process safely.")
              paragraphs = [paragraph.text for paragraph in document.paragraphs]

              table_cells: list[str] = []
              cell_count = 0
              for table in document.tables:
                  for row in table.rows:
                      for cell in row.cells:
                          cell_count += 1
                          if cell_count > MAX_DOCX_TABLE_CELLS:
                              raise ResumeFileExtractionError(
                                  "DOCX resume contains too many table cells to process safely."
                              )
                          if cell.text.strip():
                              table_cells.append(cell.text)

              return "\n".join(paragraphs + table_cells)


          def _extract_pdf_text(contents: bytes) -> str:
              if not contents.lstrip().startswith(b"%PDF-"):
                  raise ResumeFileExtractionError("PDF resume structure is invalid.")

              try:
                  reader = PdfReader(BytesIO(contents))
                  if reader.is_encrypted:
                      raise ResumeFileExtractionError("Encrypted PDF resumes are not supported.")
                  if len(reader.pages) > MAX_PDF_PAGES:
                      raise ResumeFileExtractionError(
                          f"PDF resume has too many pages. Maximum supported pages: {MAX_PDF_PAGES}."
                      )

                  page_text: list[str] = []
                  extracted_characters = 0
                  for page in reader.pages:
                      page_contents = page.get_contents()
                      if page_contents is not None:
                          decoded_stream = page_contents.get_data()
                          if len(decoded_stream) > MAX_PDF_PAGE_CONTENT_STREAM_BYTES:
                              raise ResumeFileExtractionError(
                                  "PDF resume contains an oversized page content stream."
                              )

                      extracted_page_text = page.extract_text() or ""
                      extracted_characters += len(extracted_page_text)
                      if extracted_characters > MAX_PARSER_EXTRACTED_TEXT_CHARACTERS:
                          raise ResumeFileExtractionError(
                              "PDF resume contains too much extracted text to process safely."
                          )
                      if extracted_page_text.strip():
                          page_text.append(extracted_page_text)

                  return "\n".join(page_text)
              except ResumeFileExtractionError:
                  raise
              except (PdfReadError, ValueError, OSError) as exc:
                  raise ResumeFileExtractionError("Could not read text from this PDF resume file.") from exc
              except Exception as exc:
                  raise ResumeFileExtractionError("PDF resume exceeded safe parser limits.") from exc


          def extract_resume_text_from_upload(filename: str, contents: bytes) -> tuple[str, list[str]]:
              """Extract readable text and warnings from a supported resume upload."""

              extension = os.path.splitext(filename.lower())[1]
              warnings = [
                  "Uploaded resume text is returned for this request and is not saved to the shared database."
              ]

              if extension not in SUPPORTED_RESUME_UPLOAD_EXTENSIONS:
                  raise ResumeFileExtractionError(
                      "Resume upload supports .txt, .md, .pdf, and .docx files."
                  )

              if extension in {".txt", ".md"}:
                  raw_text = _extract_text_file(contents)
              elif extension == ".docx":
                  raw_text = _extract_docx_text(contents)
              elif extension == ".pdf":
                  raw_text = _extract_pdf_text(contents)
                  warnings.append(
                      "PDF extraction depends on whether the PDF contains selectable text; scanned/image-only PDFs may not work."
                  )
              else:
                  raise ResumeFileExtractionError(
                      "Resume upload supports .txt, .md, .pdf, and .docx files."
                  )

              text = _normalize_extracted_text(raw_text)
              if not text:
                  raise ResumeFileExtractionError(
                      "Uploaded resume file did not contain readable text. Try exporting it as DOCX or plain text."
                  )

              return text, warnings
          ''')
          Path("backend/app/resume_files.py").write_text(resume_files_py)

          # Patch the API entrypoint without rewriting unrelated product behavior.
          main_path = Path("backend/app/main.py")
          main = main_path.read_text()
          main = main.replace("import ipaddress\n", "").replace("import time\n", "")
          for constant_name in (
              "RATE_LIMIT_WINDOW_SECONDS",
              "RATE_LIMIT_MAX_REQUESTS",
              "RATE_LIMIT_GLOBAL_MAX_REQUESTS",
              "RATE_LIMIT_MAX_TRACKED_CLIENTS",
          ):
              main = "\n".join(
                  line for line in main.splitlines() if not line.startswith(f"{constant_name} =")
              ) + "\n"

          import_anchor = "from app.saved_reports import router as saved_reports_router\n"
          security_import = dedent('''\
          from app.security import (
              RequestBodyLimitMiddleware,
              SecurityHeadersMiddleware,
              enforce_admin_rate_limit,
              enforce_expensive_rate_limit,
              enforce_private_rate_limit,
              enforce_public_rate_limit,
              fastapi_docs_configuration,
          )
          ''')
          assert import_anchor in main
          main = main.replace(import_anchor, import_anchor + security_import)

          rate_start = main.index("\ndef _validated_ip(")
          rate_end = main.index("\n\napp = FastAPI(", rate_start)
          main = main[:rate_start] + main[rate_end:]

          old_admin_signature = dedent('''\
          def require_admin_api_key(
              x_admin_api_key: Annotated[str | None, Header(alias="X-Admin-API-Key")] = None,
          ) -> None:
              """Protect admin-only write endpoints with a server-side API key."""
              expected_api_key = os.getenv(ADMIN_API_KEY_ENV)
          ''')
          new_admin_signature = dedent('''\
          def require_admin_api_key(
              request: Request,
              x_admin_api_key: Annotated[str | None, Header(alias="X-Admin-API-Key")] = None,
          ) -> None:
              """Protect admin-only write endpoints with a server-side API key and abuse bound."""
              enforce_admin_rate_limit(request)
              expected_api_key = os.getenv(ADMIN_API_KEY_ENV)
          ''')
          assert old_admin_signature in main
          main = main.replace(old_admin_signature, new_admin_signature)

          app_marker = '    version="0.9.0",\n)\n\napp.add_middleware(\n    CORSMiddleware,'
          app_replacement = '    version="0.9.0",\n    **fastapi_docs_configuration(),\n)\n\napp.add_middleware(RequestBodyLimitMiddleware)\napp.add_middleware(SecurityHeadersMiddleware)\napp.add_middleware(\n    CORSMiddleware,'
          assert app_marker in main
          main = main.replace(app_marker, app_replacement)
          main = main.replace('    allow_methods=["*"],\n    allow_headers=["*"],', '    allow_methods=["GET", "POST", "DELETE", "OPTIONS"],\n    allow_headers=["Authorization", "Content-Type", "X-Admin-API-Key"],')

          old_me = dedent('''\
          def current_user_profile(
              current_user: AuthenticatedUser = Depends(get_current_user),
          ) -> CurrentUserResponse:
              return CurrentUserResponse(
          ''')
          new_me = dedent('''\
          def current_user_profile(
              request: Request,
              current_user: AuthenticatedUser = Depends(get_current_user),
          ) -> CurrentUserResponse:
              enforce_private_rate_limit(request, current_user.user_id)
              return CurrentUserResponse(
          ''')
          assert old_me in main
          main = main.replace(old_me, new_me)

          main = main.replace(
              '@app.post("/skills/extract", response_model=SkillExtractionResponse)\n',
              '@app.post(\n    "/skills/extract",\n    response_model=SkillExtractionResponse,\n    dependencies=[Depends(enforce_public_rate_limit)],\n)\n',
          )
          main = main.replace(
              '@app.post("/resume/analyze", response_model=ResumeAnalysisResponse)\n@app.post("/analysis/resume", response_model=ResumeAnalysisResponse)\n',
              '@app.post(\n    "/resume/analyze",\n    response_model=ResumeAnalysisResponse,\n    dependencies=[Depends(enforce_public_rate_limit)],\n)\n@app.post(\n    "/analysis/resume",\n    response_model=ResumeAnalysisResponse,\n    dependencies=[Depends(enforce_public_rate_limit)],\n)\n',
          )
          main = main.replace("Depends(enforce_public_rate_limit)", "Depends(enforce_expensive_rate_limit)", 5)
          # Restore standard limits for the two lower-cost routes added above.
          main = main.replace(
              '"/skills/extract",\n    response_model=SkillExtractionResponse,\n    dependencies=[Depends(enforce_expensive_rate_limit)]',
              '"/skills/extract",\n    response_model=SkillExtractionResponse,\n    dependencies=[Depends(enforce_public_rate_limit)]',
          )
          main = main.replace(
              '"/resume/analyze",\n    response_model=ResumeAnalysisResponse,\n    dependencies=[Depends(enforce_expensive_rate_limit)]',
              '"/resume/analyze",\n    response_model=ResumeAnalysisResponse,\n    dependencies=[Depends(enforce_public_rate_limit)]',
          )
          main = main.replace(
              '"/analysis/resume",\n    response_model=ResumeAnalysisResponse,\n    dependencies=[Depends(enforce_expensive_rate_limit)]',
              '"/analysis/resume",\n    response_model=ResumeAnalysisResponse,\n    dependencies=[Depends(enforce_public_rate_limit)]',
          )
          main_path.write_text(main)

          private_db_path = Path("backend/app/private_database.py")
