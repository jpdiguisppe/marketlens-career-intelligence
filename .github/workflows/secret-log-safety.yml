name: Secret and Log Safety

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  secret-log-safety:
    name: Secret scan and log redaction
    runs-on: ubuntu-latest

    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Scan tracked files and reachable git history
        id: secret_scan
        working-directory: backend
        shell: bash
        run: |
          set +e
          python scripts/run_secret_log_safety_audit.py --history > /tmp/secret-scan.txt 2>&1
          status=$?
          cat /tmp/secret-scan.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run redaction and safe HTTP tests
        id: log_safety
        working-directory: backend
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_safe_logging.py \
            tests/test_http_safety.py \
            tests/test_secret_log_safety_audit.py \
            > /tmp/log-safety-tests.txt 2>&1
          status=$?
          cat /tmp/log-safety-tests.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Post safe failure summary
        if: >-
          github.event_name == 'pull_request' &&
          (steps.secret_scan.outputs.status != '0' || steps.log_safety.outputs.status != '0')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'Secret and log safety failure summary:'
            echo '```text'
            head -n 35 /tmp/secret-scan.txt
            head -n 35 /tmp/log-safety-tests.txt
            echo '```'
          } > /tmp/secret-log-safety-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/secret-log-safety-comment.md

      - name: Fail when safety checks fail
        if: >-
          steps.secret_scan.outputs.status != '0' ||
          steps.log_safety.outputs.status != '0'
        run: exit 1
