name: Apply Search UX Lockfile Update

on:
  push:
    branches: [post-milestone-7-search-ux-polish]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: post-milestone-7-search-ux-polish
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply non-breaking audit fix and build
        working-directory: frontend
        run: |
          npm ci
          npm audit fix || true
          npm run build

      - name: Commit clean lockfile update
        run: |
          git rm .github/workflows/apply-search-ux-lockfile.yml
          git add frontend/package-lock.json
          git config user.name "jpdiguisppe"
          git config user.email "186861311+jpdiguisppe@users.noreply.github.com"
          git commit -m "Apply safe frontend dependency patches"
          git push origin HEAD:post-milestone-7-search-ux-polish
