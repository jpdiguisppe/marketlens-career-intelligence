name: Search correctness diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply tested correctness revision
        id: revision
        shell: bash
        run: |
          set -e
          if git apply --check .github/search-correctness-revision.patch; then
            git apply .github/search-correctness-revision.patch
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/app/job_search_intent_patch.py \
              backend/app/job_search_correctness_patch.py \
              backend/tests/test_job_search.py
            git commit -m "Refine cross-sector search precision and recall"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.revision.outputs.pushed != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        if: steps.revision.outputs.pushed != 'true'
        run: python -m pip install -r backend/requirements.txt
      - name: Capture pytest and benchmark reports
        if: steps.revision.outputs.pushed != 'true'
        id: diagnostics
        shell: bash
        run: |
          set +e
          cd backend
          python -m pytest -q --tb=short > ../pytest-report.txt 2>&1
          pytest_status=$?
          python scripts/run_job_search_evaluation.py > ../benchmark-report.txt 2>&1
          benchmark_status=$?
          echo "pytest_status=$pytest_status" >> "$GITHUB_OUTPUT"
          echo "benchmark_status=$benchmark_status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostics
        if: steps.revision.outputs.pushed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: search-correctness-diagnostics
          path: |
            pytest-report.txt
            benchmark-report.txt
          if-no-files-found: error
      - name: Upload backend source snapshot
        if: steps.revision.outputs.pushed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: search-correctness-backend-source
          path: backend
          if-no-files-found: error
      - name: Fail when diagnostics failed
        if: steps.revision.outputs.pushed != 'true' && (steps.diagnostics.outputs.pytest_status != '0' || steps.diagnostics.outputs.benchmark_status != '0')
        run: exit 1
