name: Search correctness diagnostics

on:
  pull_request:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Capture pytest and benchmark reports
        id: diagnostics
        shell: bash
        run: |
          set +e
          cd backend
          python -m pytest -q --tb=short > ../pytest-report.txt 2>&1
          pytest_status=$?
          python scripts/run_job_search_evaluation.py > ../benchmark-report.txt 2>&1
          benchmark_status=$?
          echo "pytest_status=$pytest_status" >> "$GITHUB_OUTPUT"
          echo "benchmark_status=$benchmark_status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: search-correctness-diagnostics
          path: |
            pytest-report.txt
            benchmark-report.txt
          if-no-files-found: error
      - name: Upload backend source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: search-correctness-backend-source
          path: backend
          if-no-files-found: error
      - name: Fail when diagnostics failed
        if: steps.diagnostics.outputs.pytest_status != '0' || steps.diagnostics.outputs.benchmark_status != '0'
        run: exit 1
