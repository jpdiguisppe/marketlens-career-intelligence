name: Container Runtime Security Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-runtime-security-smoke:
    name: Start containers as non-root and verify hardened surface
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build backend and frontend images
        shell: bash
        run: |
          set -euo pipefail
          docker build -t marketlens-backend-smoke ./backend
          docker build \
            --build-arg VITE_API_BASE_URL=http://localhost:8000 \
            --build-arg RAILWAY_GIT_COMMIT_SHA=0123456789abcdef0123456789abcdef01234567 \
            -t marketlens-frontend-smoke \
            ./frontend

      - name: Start backend as non-root
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name marketlens-backend-smoke \
            --publish 18000:8000 \
            --env PORT=8000 \
            --env DATABASE_URL=sqlite:////app/data/marketlens.db \
            --env AUTH_DEV_MODE=false \
            marketlens-backend-smoke

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:18000/health \
              --output /tmp/backend-health.json; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs marketlens-backend-smoke
              exit 1
            fi
            sleep 2
          done

          docker exec marketlens-backend-smoke sh -c 'test "$(id -u)" -ne 0'
          curl --silent --show-error --max-time 10 \
            --dump-header /tmp/backend.headers \
            --output /tmp/backend.body \
            http://127.0.0.1:18000/health
          grep -Eqi '^x-content-type-options:[[:space:]]*nosniff[[:space:]]*$' /tmp/backend.headers
          grep -Eqi '^x-frame-options:[[:space:]]*DENY[[:space:]]*$' /tmp/backend.headers
          grep -Eqi '^cache-control:.*no-store' /tmp/backend.headers

          docker logs marketlens-backend-smoke > /tmp/backend.log 2>&1
          if grep -Fq -- '--- Logging error ---' /tmp/backend.log; then
            cat /tmp/backend.log
            echo 'Backend emitted a logging formatter error.'
            exit 1
          fi

      - name: Start frontend as non-root on dynamic port with port-80 compatibility
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name marketlens-frontend-smoke \
            --publish 18080:8080 \
            --env PORT=8080 \
            --env VITE_API_BASE_URL=http://localhost:8000 \
            marketlens-frontend-smoke

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:18080/ \
              --output /tmp/frontend-root.html; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs marketlens-frontend-smoke
              exit 1
            fi
            sleep 2
          done

          docker exec marketlens-frontend-smoke sh -c 'test "$(id -u)" -ne 0'
          docker exec marketlens-frontend-smoke sh -c 'wget -qO /tmp/port80.html http://127.0.0.1:80/ && test -s /tmp/port80.html'

          curl --silent --show-error --max-time 10 \
            --dump-header /tmp/frontend.headers \
            --output /tmp/frontend.body \
            http://127.0.0.1:18080/
          curl --fail --silent --show-error --max-time 10 \
            http://127.0.0.1:18080/config.js \
            --output /tmp/config.js
          curl --fail --silent --show-error --max-time 10 \
            http://127.0.0.1:18080/deployment-revision.txt \
            --output /tmp/frontend-deployment-revision.txt

          grep -Eqi '^strict-transport-security:' /tmp/frontend.headers
          grep -Eqi '^x-content-type-options:[[:space:]]*nosniff[[:space:]]*$' /tmp/frontend.headers
          grep -Eqi '^x-frame-options:[[:space:]]*DENY[[:space:]]*$' /tmp/frontend.headers
          grep -Eqi '^cache-control:.*no-store' /tmp/frontend.headers
          grep -Eqi '^content-security-policy:.*frame-ancestors .none.' /tmp/frontend.headers
          grep -Eqi '^content-security-policy:.*object-src .none.' /tmp/frontend.headers
          grep -Eqi '^content-security-policy:.*connect-src[^;]*http://localhost:8000' /tmp/frontend.headers
          grep -Fq 'apiBaseUrl: "http://localhost:8000"' /tmp/config.js
          test "$(tr -d '[:space:]' < /tmp/frontend-deployment-revision.txt)" = '0123456789abcdef0123456789abcdef01234567'

          docker logs marketlens-frontend-smoke > /tmp/frontend.log 2>&1
          if grep -Eqi '(emerg|crit|alert|exec format error|permission denied)' /tmp/frontend.log; then
            cat /tmp/frontend.log
            echo 'Frontend emitted a fatal runtime error.'
            exit 1
          fi

      - name: Start frontend as non-root with Railway-style PORT 80
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name marketlens-frontend-port80-smoke \
            --publish 18081:80 \
            --env PORT=80 \
            --env VITE_API_BASE_URL=http://localhost:8000 \
            marketlens-frontend-smoke

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:18081/ \
              --output /tmp/frontend-port80-root.html; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs marketlens-frontend-port80-smoke
              exit 1
            fi
            sleep 2
          done

          docker exec marketlens-frontend-port80-smoke sh -c 'test "$(id -u)" -ne 0'
          curl --silent --show-error --max-time 10 \
            --dump-header /tmp/frontend-port80.headers \
            --output /tmp/frontend-port80.body \
            http://127.0.0.1:18081/
          curl --fail --silent --show-error --max-time 10 \
            http://127.0.0.1:18081/deployment-revision.txt \
            --output /tmp/frontend-port80-deployment-revision.txt

          grep -Eqi '^x-content-type-options:[[:space:]]*nosniff[[:space:]]*$' /tmp/frontend-port80.headers
          grep -Eqi '^content-security-policy:.*frame-ancestors .none.' /tmp/frontend-port80.headers
          test "$(tr -d '[:space:]' < /tmp/frontend-port80-deployment-revision.txt)" = '0123456789abcdef0123456789abcdef01234567'

          docker logs marketlens-frontend-port80-smoke > /tmp/frontend-port80.log 2>&1
          if grep -Eqi '(emerg|crit|alert|exec format error|permission denied)' /tmp/frontend-port80.log; then
            cat /tmp/frontend-port80.log
            echo 'PORT=80 frontend emitted a fatal runtime error.'
            exit 1
          fi

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: marketlens-container-runtime-security-smoke
          path: |
            /tmp/backend-health.json
            /tmp/backend.headers
            /tmp/backend.body
            /tmp/backend.log
            /tmp/frontend-root.html
            /tmp/frontend.headers
            /tmp/frontend.body
            /tmp/frontend.log
            /tmp/config.js
            /tmp/frontend-deployment-revision.txt
            /tmp/frontend-port80-root.html
            /tmp/frontend-port80.headers
            /tmp/frontend-port80.body
            /tmp/frontend-port80.log
            /tmp/frontend-port80-deployment-revision.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Show container logs on failure
        if: failure()
        shell: bash
        run: |
          docker logs marketlens-backend-smoke || true
          docker logs marketlens-frontend-smoke || true
          docker logs marketlens-frontend-port80-smoke || true

      - name: Clean up containers
        if: always()
        shell: bash
        run: |
          docker rm --force \
            marketlens-backend-smoke \
            marketlens-frontend-smoke \
            marketlens-frontend-port80-smoke \
            || true
