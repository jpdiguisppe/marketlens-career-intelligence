name: Smart Fit Evaluation

on:
  pull_request:
    paths:
      - "backend/app/analysis/**"
      - "backend/evaluation/smart_fit_benchmark.json"
      - "backend/scripts/run_smart_fit_evaluation.py"
      - "backend/tests/test_smart_fit_evaluation.py"
      - ".github/workflows/smart-fit-evaluation.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run Smart Fit benchmark
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_smart_fit_evaluation.py | tee smart-fit-evaluation.txt
      - name: Upload Smart Fit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-fit-evaluation-report
          path: backend/smart-fit-evaluation.txt
          if-no-files-found: error
