name: Provider Telemetry

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  provider-telemetry:
    name: Provider telemetry and cost checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate request-scoped telemetry and pricing boundaries
        working-directory: backend
        run: python -m pytest -q tests/test_provider_telemetry.py
