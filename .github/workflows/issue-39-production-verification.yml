name: Issue 39 Production Verification

on:
  pull_request:
    branches: [main]

jobs:
  verify-production:
    if: github.head_ref == 'production-verify-issue-39'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Railway production
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.parse
          import urllib.request

          BACKEND = "https://marketlens-career-intelligence-production.up.railway.app"
          FRONTEND = "https://marketlens-career-intelligence-production-8a34.up.railway.app"

          def get_text(url: str, timeout: int = 180) -> tuple[int, str]:
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json,text/html;q=0.9,*/*;q=0.8",
                      "User-Agent": "MarketLens Issue 39 Production Verification",
                  },
              )
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  return response.status, response.read().decode("utf-8")

          def wait_for_health() -> dict:
              failures = []
              for attempt in range(30):
                  try:
                      status, text = get_text(f"{BACKEND}/health", timeout=30)
                      payload = json.loads(text)
                      if status == 200 and payload == {"status": "ok"}:
                          return payload
                      failures.append(f"attempt {attempt + 1}: {status} {text[:200]}")
                  except Exception as exc:
                      failures.append(f"attempt {attempt + 1}: {type(exc).__name__}: {exc}")
                  time.sleep(10)
              raise AssertionError("Production health did not become ready:\n" + "\n".join(failures[-5:]))

          def search(query: str, level: str, location: str | None, limit: int = 15) -> dict:
              params = {"query": query, "level": level, "limit": str(limit)}
              if location is not None:
                  params["location"] = location
              url = f"{BACKEND}/jobs/search?{urllib.parse.urlencode(params)}"
              status, text = get_text(url)
              assert status == 200, (url, status, text[:500])
              payload = json.loads(text)
              assert payload["query"]
              assert payload["level"] == level
              assert payload["result_count"] == len(payload["results"])
              assert payload["source_coverage"]
              assert payload["external_search_links"]
              assert all(link["url"].startswith("https://") for link in payload["external_search_links"])
              assert not any(
                  provider.lower().startswith(("linkedin", "indeed", "handshake", "workday"))
                  for provider in payload["providers_searched"]
              )
              for result in payload["results"]:
                  assert result["apply_url"].startswith("https://")
              return payload

          wait_for_health()
          frontend_status, frontend_html = get_text(FRONTEND, timeout=60)
          assert frontend_status == 200
          assert '<div id="root"></div>' in frontend_html or 'id="root"' in frontend_html

          electrical = search("electrical engineer", "entry", "Philadelphia")
          for result in electrical["results"]:
              title = result["title"].lower()
              location = (result.get("location") or "").lower()
              assert "electrical" in title and "engineer" in title, result
              assert "remote" not in location, result
              assert not any(city in location for city in ("pittsburgh", "new york", "california")), result

          elementary = search("elementary school teacher", "entry", "Philadelphia")
          assert elementary["result_count"] >= 1, elementary
          elementary_titles = [result["title"].lower() for result in elementary["results"]]
          assert any(
              "elementary" in title or "kindergarten" in title or " grade teacher" in title
              for title in elementary_titles
          ), elementary_titles
          assert not any("middle school" in title for title in elementary_titles), elementary_titles
          for result in elementary["results"]:
              assert "remote" not in (result.get("location") or "").lower(), result

          journalism = search("journalism", "entry", "Philadelphia")
          assert journalism["result_count"] >= 1, journalism
          journalism_titles = [result["title"].lower() for result in journalism["results"]]
          assert any(
              any(term in title for term in ("journalist", "reporter", "news", "assignment", "editor"))
              for title in journalism_titles
          ), journalism_titles
          assert not any(
              any(term in title for term in ("cinematic", "film editor", "video editor"))
              for title in journalism_titles
          ), journalism_titles

          broad_entry = search("computer science", "entry", None)
          assert not any(
              result["title"].lower() == "analytics engineer"
              and not any(term in result["title"].lower() for term in ("junior", "entry", " i"))
              for result in broad_entry["results"]
          ), broad_entry["results"]

          report = {
              "passed": True,
              "backend_health": {"status": "ok"},
              "frontend_status": frontend_status,
              "searches": {
                  "electrical_engineer_entry_philadelphia": {
                      "result_count": electrical["result_count"],
                      "titles": [result["title"] for result in electrical["results"]],
                      "locations": [result.get("location") for result in electrical["results"]],
                      "providers_searched": electrical["providers_searched"],
                  },
                  "elementary_teacher_entry_philadelphia": {
                      "result_count": elementary["result_count"],
                      "titles": [result["title"] for result in elementary["results"]],
                      "locations": [result.get("location") for result in elementary["results"]],
                      "providers_searched": elementary["providers_searched"],
                  },
                  "journalism_entry_philadelphia": {
                      "result_count": journalism["result_count"],
                      "titles": [result["title"] for result in journalism["results"]],
                      "locations": [result.get("location") for result in journalism["results"]],
                      "providers_searched": journalism["providers_searched"],
                  },
                  "computer_science_entry_us": {
                      "result_count": broad_entry["result_count"],
                      "titles": [result["title"] for result in broad_entry["results"]],
                      "providers_searched": broad_entry["providers_searched"],
                  },
              },
          }
          with open("production-verification.json", "w", encoding="utf-8") as output:
              json.dump(report, output, indent=2, sort_keys=True)
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Upload production report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-39-production-verification
          path: production-verification.json
          if-no-files-found: warn
