name: Apply search hardening payload

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-39-search-correctness-hardening
          fetch-depth: 0
      - name: Decode and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/search-hardening-payload/chunk-* | base64 -d > /tmp/search-hardening-payload.tar.gz
          echo "9da757b8ec3a86646799885330659b1d7c89f867ac072fa187b1b5da8a7c17c8  /tmp/search-hardening-payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/search-hardening-payload.tar.gz -C backend
      - name: Commit applied files and remove temporary payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/search-hardening-payload
          rm -f .github/search-hardening-trigger.txt
          rm -f .github/workflows/apply-search-hardening-payload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend .github
          git commit -m "Expand cross-sector search correctness and source coverage"
          git push origin HEAD:issue-39-search-correctness-hardening
