name: Evidence Provenance

on:
  pull_request:
    paths:
      - "backend/app/analysis/schemas.py"
      - "backend/app/analysis/provenance_patch.py"
      - "backend/app/analysis/provenance_evaluation.py"
      - "backend/app/analysis/semantic_merge_patch.py"
      - "backend/app/analysis/__init__.py"
      - "backend/scripts/run_evidence_provenance_evaluation.py"
      - "backend/tests/test_evidence_provenance.py"
      - "backend/tests/test_evidence_provenance_evaluation.py"
      - "frontend/src/types.ts"
      - "backend/requirements.txt"
      - "backend/requirements-dev.txt"
      - ".github/workflows/evidence-provenance.yml"
  workflow_dispatch:

jobs:
  evidence-provenance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run focused provenance tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_evidence_provenance.py \
            tests/test_evidence_provenance_evaluation.py \
            2>&1 | tee evidence-provenance-tests.txt
      - name: Run evidence provenance benchmark
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_evidence_provenance_evaluation.py \
            2>&1 | tee evidence-provenance-benchmark.txt
      - name: Run full backend compatibility suite
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee backend-compatibility-tests.txt
      - name: Upload evidence provenance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-provenance-report
          path: |
            backend/evidence-provenance-tests.txt
            backend/evidence-provenance-benchmark.txt
            backend/backend-compatibility-tests.txt
          if-no-files-found: error
